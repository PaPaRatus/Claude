<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SANEV Chrono</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mut:#6b7686;--brand:#1f3a5f;--go:#1e8e4e;--stop:#c9302c;--line:#e1e5ec}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
header{background:var(--brand);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:2}
header h1{margin:0;font-size:18px}
#now{margin-top:6px;font-size:13px;opacity:.9}
#clock{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
main{padding:12px 16px;max-width:600px;margin:auto}
h2{font-size:14px;text-transform:uppercase;color:var(--mut);margin:20px 0 8px;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.card.run{border-color:var(--go);box-shadow:0 0 0 2px #1e8e4e33}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mut)}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;color:#fff;background:var(--brand)}
button.go{background:var(--go)} button.stop{background:var(--stop)}
button.ghost{background:#e8ecf2;color:var(--ink);padding:8px 10px;font-size:13px}
.add{display:flex;gap:8px} .add input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>SANEV — Chrono par plan</h1>
  <div id="clock">00:00:00</div>
  <div id="now">Aucun plan en cours</div>
</header>
<main>
  <h2>Plans</h2>
  <div id="plans"></div>
  <div class="add"><input id="newplan" placeholder="Nouveau plan (ex : Plan 12 – Réseau EU)"><button onclick="addPlan()">+</button></div>

  <h2>Cumul par plan</h2>
  <div id="totals"></div>

  <h2>Historique</h2>
  <div style="overflow-x:auto"><table id="log"></table></div>

  <h2>Données</h2>
  <button onclick="exportCsv()">Exporter / partager (CSV)</button>
  <button class="ghost" onclick="resetAll()">Tout effacer</button>
</main>
<script>
const K='sanev_chrono_v1';
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{plans:[],sessions:[],running:null}; // running:{plan,start}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const fmt=ms=>{const s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
const fdt=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addPlan(){
  const i=document.getElementById('newplan'),n=i.value.trim();
  if(!n||S.plans.includes(n))return;
  S.plans.push(n);i.value='';save();render();
}
function stopCurrent(){
  if(!S.running)return;
  S.sessions.push({plan:S.running.plan,start:S.running.start,end:Date.now()});
  S.running=null;
}
function toggle(i){
  const n=S.plans[i], was=S.running&&S.running.plan===n;
  stopCurrent();
  if(!was)S.running={plan:n,start:Date.now()};
  save();render();
}
function delPlan(i){
  if(!confirm('Supprimer ce plan de la liste ? (l\'historique est conservé)'))return;
  if(S.running&&S.running.plan===S.plans[i])stopCurrent();
  S.plans.splice(i,1);save();render();
}
function totalFor(n){
  let t=S.sessions.filter(s=>s.plan===n).reduce((a,s)=>a+s.end-s.start,0);
  if(S.running&&S.running.plan===n)t+=Date.now()-S.running.start;
  return t;
}
function render(){
  document.getElementById('plans').innerHTML=S.plans.map((n,i)=>{
    const run=S.running&&S.running.plan===n;
    return `<div class="card ${run?'run':''}"><div class="info"><div class="name">${esc(n)}</div>
      <div class="sub">Total : ${fmt(totalFor(n))}${run?' · démarré '+fdt(S.running.start):''}</div></div>
      <button class="${run?'stop':'go'}" onclick="toggle(${i})">${run?'■ Fin':'▶ Début'}</button>
      <button class="ghost" onclick="delPlan(${i})">✕</button></div>`}).join('')||'<div class="sub">Ajoutez votre premier plan ci-dessous.</div>';
  const names=[...new Set([...S.plans,...S.sessions.map(s=>s.plan)])];
  document.getElementById('totals').innerHTML=names.map(n=>`<div class="card"><div class="info name">${esc(n)}</div><b>${fmt(totalFor(n))}</b></div>`).join('');
  document.getElementById('log').innerHTML='<tr><th>Plan</th><th>Début</th><th>Fin</th><th>Durée</th></tr>'+
    S.sessions.slice().reverse().map(s=>`<tr><td>${esc(s.plan)}</td><td>${fdt(s.start)}</td><td>${fdt(s.end)}</td><td>${fmt(s.end-s.start)}</td></tr>`).join('');
  tick();
}
function tick(){
  document.getElementById('clock').textContent=S.running?fmt(Date.now()-S.running.start):'00:00:00';
  document.getElementById('now').textContent=S.running?'En cours : '+S.running.plan:'Aucun plan en cours';
}
function exportCsv(){
  const rows=[['Plan','Debut','Fin','Duree (h:m:s)','Duree (min)']];
  S.sessions.forEach(s=>rows.push([s.plan,new Date(s.start).toLocaleString('fr-FR'),new Date(s.end).toLocaleString('fr-FR'),fmt(s.end-s.start),((s.end-s.start)/60000).toFixed(1)]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  if(window.Android)Android.share('SANEV chrono',csv);
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sanev_chrono.csv';a.click()}
}
function resetAll(){
  if(confirm('Effacer plans ET historique ?')){S={plans:[],sessions:[],running:null};save();render()}
}
document.getElementById('newplan').addEventListener('keydown',e=>{if(e.key==='Enter')addPlan()});
setInterval(()=>{tick();if(S.running)render()},1000);
render();
</script>
</body>
</html>
